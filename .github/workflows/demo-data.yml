name: Build GitHub demo data
on:
  workflow_dispatch:
    inputs:
      repo:
        description: Public repository (owner/repo)
        required: true
        default: vitejs/vite
      limit:
        description: Number of most recent closed PRs (max 100)
        required: true
        default: '100'
permissions:
  contents: write
  pull-requests: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-github-demo.mjs "${{ inputs.repo }}" "${{ inputs.limit }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Open a pull request with the data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_INPUT: ${{ inputs.repo }}
        run: |
          branch="demo-data/${REPO_INPUT//\//-}-$(date +%Y%m%d%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add public/demo
          git commit -m "Demo data: $REPO_INPUT pull requests"
          git push -u origin "$branch"
          gh pr create --title "Demo data: $REPO_INPUT" --body "Generated by the Build GitHub demo data workflow." --base main
